<section class="astra-section astra-news" aria-labelledby="astra-news-title">
  <div class="astra-section-heading">
    <h2 id="astra-news-title">Latest news</h2>
    <a class="astra-text-link" href="{{ '/news/' | relative_url }}">View all news <span aria-hidden="true">→</span></a>
  </div>
  <p class="astra-meta">Dated events precede year-only highlights within each year.</p>
  <ul class="astra-news-list">{% for item in site.news_homepage %}{% include news/row.html item=item homepage=true %}{% endfor %}</ul>
</section>
