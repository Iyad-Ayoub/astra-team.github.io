# Evidence-aware platform registry. `temporal_status` describes what the cited
# evidence establishes, not an inferred present-day availability.
- id: zoe
  name: Zoé Autonomous Research Vehicle
  platform_type: Autonomous research vehicle
  relationship: astra_inria
  temporal_status: current
  evidence_status: directly_documented
  summary: Renault Zoé is ASTRA’s autonomous research vehicle for perception, localization, and autonomous-driving experiments.
  ownership_context: ASTRA / Inria platform vehicle
  evidence_as_of: '2025-12'
  sources:
    - title: ASTRA 2025 activity report
      url: https://radar.inria.fr/report/2025/astra/index.html
      publisher: Inria
      year: 2025
      source_type: activity_report
      supports: ASTRA possession in December 2025, robotisation context, and initial Rocquencourt tests.
  media:
    - role: primary
      path: /assets/img/platforms/astra-zoe-platform.jpg
      alt: ASTRA Renault Zoé autonomous research vehicle with roof-mounted sensor frame
      credit: ASTRA team
      source_url: https://radar.inria.fr/report/2025/astra/index.html
      source_title: ASTRA 2025 activity report
    - role: provenance
      path: /assets/img/platforms/astra-zoe-onboard-system.jpg
      alt: ASTRA Renault Zoé rear cargo-area research installation
      credit: ASTRA team
      source_url: https://radar.inria.fr/report/2025/astra/index.html
      source_title: ASTRA 2025 activity report

