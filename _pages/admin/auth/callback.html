  <title>ASTRA CMS — GitHub sign in</title>
  <link rel="stylesheet" href="{{ '/assets/css/admin.css' | relative_url }}">
</head>
<body class="astra-admin-body" data-admin-mode="callback">
  <main class="astra-admin-shell" aria-live="polite">

      <p class="astra-admin-kicker">ASTRA CMS</p>
      <h1>GitHub sign in</h1>

    <section id="admin-loading" class="astra-admin-card"><p>Completing GitHub sign-in…</p></section>

      <p id="admin-denied-message">This sign-in link is invalid, expired, or no longer available.</p>
      <a class="astra-admin-text-link" href="{{ '/admin/' | relative_url }}">Return to sign in</a>
    </section>
  </main>
  <script src="{{ '/assets/js/admin/config.js' | relative_url }}"></script>
