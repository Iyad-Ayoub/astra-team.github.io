# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy astra-team with jekyll

on:
  # Runs validation and baseline builds on every pushed branch.
  push:
    branches: ["**"]
  
  schedule:
    # Every Monday at 2am UTC
    - cron: '0 2 * * 1'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Each job receives only the permissions it needs.
permissions: {}

# Keep production deployment runs intact. A CMS publication branch is safe to
# cancel and restart because its final atomic commit supersedes setup commits.
concurrency:
  group: ${{ startsWith(github.ref, 'refs/heads/cms-publish/') && format('cms-publication-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/cms-publish/') }}

jobs:
  # Build job
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pages: read
    env:
      BUNDLE_FROZEN: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - name: Set up Node for minification and browser checks
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, Node 24 action runtime
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install ImageMagick and native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick build-essential patch pkg-config libssl-dev zlib1g-dev liblzma-dev
      - name: Setup Ruby
        # https://github.com/ruby/setup-ruby/releases/tag/v1.321.0 (Node 24)
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          # Read Ruby from .ruby-version and Bundler from Gemfile.lock.
          # Keep the Ruby distribution's RubyGems; no independent downgrade.
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
      - name: Validate source and regression tests
        run: |
          bundle exec ruby scripts/validate_site.rb --source-only
          bundle exec ruby tests/validation_test.rb
          python3 -m unittest discover -s tests -p 'test_*.py'
      # Corpus snapshots run before the optional live HAL refresh. A legitimate
      # new HAL record must not fail tests pinned to the versioned 259 entries.
      - name: Build and test versioned root and project-subpath baselines
        env:
          JEKYLL_ENV: production
        run: |
          # Keep this gate self-contained: tests/run_ruby.sh was local-only,
          # so a fresh Actions checkout could not invoke it (exit 127).
          set -euo pipefail
          for baseurl in "" "/astra-team.github.io"; do
            destination="$RUNNER_TEMP/astra-root"
            if [ -n "$baseurl" ]; then destination="$RUNNER_TEMP/astra-subpath"; fi
            bundle exec jekyll build --destination "$destination" --baseurl "$baseurl"
            for phase in 5 6 7 8 9 10; do
              export "PHASE${phase}_SITE=$destination" "PHASE${phase}_BASEURL=$baseurl"
            done
            export PRE10_SITE="$destination" PRE10_BASEURL="$baseurl"
            for test in tests/*_test.rb; do bundle exec ruby "$test"; done
            bundle exec ruby scripts/validate_site.rb "$destination" "$baseurl"
          done
          bundle exec jekyll doctor
      - name: Install pinned browser test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/astra-browser" --no-save --no-package-lock playwright@1.63.0
          node "$RUNNER_TEMP/astra-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check containment, metadata and analytics in browser
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/astra-browser/node_modules/playwright
        run: |
          PHASE10_SITE="$RUNNER_TEMP/astra-root" node tests/phase10_browser_test.cjs
          PHASE10_SITE="$RUNNER_TEMP/astra-subpath" PHASE10_BASEURL="/astra-team.github.io" node tests/phase10_browser_test.cjs
      - name: Retrieve all HAL publications
        if: github.ref == 'refs/heads/main'
        run: bash scripts/publication-update.sh
      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        if: github.ref == 'refs/heads/main'
        # Outputs to the './_site' directory by default
        run: |
          bundle exec jekyll build --baseurl "$PAGES_BASE_PATH"
          bundle exec ruby scripts/validate_site.rb _site "$PAGES_BASE_PATH"
          PHASE10_SITE="$PWD/_site" bundle exec ruby tests/phase10_release_test.rb
          PHASE10_SITE="$PWD/_site" PHASE10_BASEURL="$PAGES_BASE_PATH" bundle exec ruby tests/phase10c_readiness_test.rb
        env:
          JEKYLL_ENV: production
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Browser-safe configuration emitted only into the isolated admin app.
          # Browser-safe GitHub App values. The OAuth broker keeps every
          # confidential GitHub App credential outside the Pages artifact.
          GITHUB_APP_CLIENT_ID: ${{ vars.ASTRA_GITHUB_APP_CLIENT_ID }}
          GITHUB_AUTH_BROKER_URL: ${{ vars.ASTRA_GITHUB_AUTH_BROKER_URL }}
          GITHUB_REPO_OWNER: Iyad-Ayoub
          GITHUB_REPO_NAME: astra-team.github.io
          CMS_REQUIRE_CONFIG: 'true'
          # Only the authoritative repository is indexable, even for a root-hosted fork.
          ASTRA_BUILD_CONTEXT: ${{ github.repository == 'astra-team/astra-team.github.io' && 'production' || 'staging' }}
      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
