# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy astra-team with jekyll

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
  
  schedule:
    # Every Monday at 2am UTC
    - cron: '0 2 * * 1'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Each job receives only the permissions it needs.
permissions: {}

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pages: read
    env:
      BUNDLE_FROZEN: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
      - name: Setup Ruby
        # https://github.com/ruby/setup-ruby/releases/tag/v1.207.0
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          # Read the tested runtime from .ruby-version.
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
      - name: Validate source and regression tests
        run: |
          bundle exec ruby scripts/validate_site.rb --source-only
          bundle exec ruby tests/validation_test.rb
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Retrieve all HAL publications
        run: bash scripts/publication-update.sh
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: |
          bundle exec jekyll build --baseurl "$PAGES_BASE_PATH"
          bundle exec ruby scripts/validate_site.rb _site "$PAGES_BASE_PATH"
        env:
          JEKYLL_ENV: production
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
